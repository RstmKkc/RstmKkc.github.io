<!DOCTYPE html>
<html lang="tr" manifest="slopkit.manifest">
<head><meta charset="utf-8">
<title>BFR PS4 HOST</title>
<link rel="stylesheet" href="bfr.css">
</head>
<body>
<script>
history.replaceState(null,null,'index.html');var histlength=history.length;history.go(-histlength);
function DLProgress(e){Percent=(Math.round(e.loaded / e.total * 100));window.msgs.innerHTML="Çevrimdışı önbellek indiriliyor: " + Percent + "%";}
function DisplayCacheProgress(){window.msgs.innerHTML="Önbellek kuruldu ✔";setTimeout(function(){window.msgs.innerHTML="Tarayıcıyı kapatıp yeniden açın.";},1500);}
window.applicationCache.addEventListener("progress",DLProgress,false);
window.applicationCache.oncached=function(e){DisplayCacheProgress();};
window.applicationCache.onupdateready=function(e){DisplayCacheProgress();};
window.applicationCache.onerror=function(e){window.msgs.innerHTML="Önbellek kurulamadı. Bağlantıyı kontrol edin ve yeniden deneyin.";};
</script>
<h1>BFR PS4 HOST</h1>
<hr>
<br>
<h1 id=msgs style="font-size: 30px;margin: 60px 24px;">Önbellek kurulumu başlıyor…</h1>
<p>BFR PS4 HOST</p>
</body>
</html>
